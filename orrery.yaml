# What this repository builds, for the Orrery of an estate that reads it.
# redgreen reads this file with the repository and writes the service, its
# logo, and the APIs it calls; an estate that does not read this repository
# never lists it. `fields` and `relations` place it in the house's platform
# pillars (plat_pillar); an API key is the providing service's key and its id.
service: github/dsswift/redgreen
icon:
  name: redgreen
  file: logo.svg
fields:
  category: Delivery outcomes
relations:
  pillars:
  - platform/outcomes
  - platform/catalog
consumes:
- github/dsswift/orrery/catalog
- github/api
- gitlab/api
- azuredevops/api
- microsoft/entra
