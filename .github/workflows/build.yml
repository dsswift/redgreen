name: Build

# The release workflow calls this with the new tag. It publishes the image, tagged with the version, to
# ghcr.io/dsswift/redgreen. The GitHub Container Registry package is public, so a cluster pulls it without a
# secret; pin it by digest. The image is signed with cosign keyless as this workflow's GitHub identity, with a
# syft SBOM attested to it.
# The tag must match the version in package.json; that file is the source of truth.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

env:
  GHCR: ghcr.io/dsswift
  IMAGE: redgreen

permissions:
  contents: read
  packages: write
  # Needed to get an OIDC token for keyless signing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check the tag matches package.json
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: push
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GHCR }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      # Sign and attest by digest, never by tag: a tag can move.
      - name: Sign the image
        env:
          REF: ${{ env.GHCR }}/${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Attest the SBOM
        env:
          REF: ${{ env.GHCR }}/${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          syft "$REF" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$REF"
      - name: Verify what was published
        env:
          REF: ${{ env.GHCR }}/${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/'
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' > /dev/null
