name: Build

# The release workflow calls this with the new tag. It publishes the image, tagged with the version, to
# ghcr.io/dsswift/redgreen. The GitHub Container Registry package is public, so a cluster pulls it without a
# secret; pin it by digest.
# The tag must match the version in package.json; that file is the source of truth.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

env:
  GHCR: ghcr.io/dsswift
  IMAGE: redgreen

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check the tag matches package.json
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GHCR }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
