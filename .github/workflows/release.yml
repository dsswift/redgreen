name: Release

# Pushing a tag like v0.1.0 publishes the image, tagged with the version, to
# spraguehouse.azurecr.io/redgreen and to ghcr.io/dsswift/redgreen. The GitHub
# Container Registry package is public, so a cluster pulls it without a
# secret; pin it by digest.
# The tag must match the version in package.json; that file is the source of truth.
on:
  push:
    tags: ['v*']

env:
  REGISTRY: spraguehouse.azurecr.io
  GHCR: ghcr.io/dsswift
  IMAGE: redgreen

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
